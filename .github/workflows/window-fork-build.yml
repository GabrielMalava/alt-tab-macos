name: window fork build

on:
  push:
    branches: [window-groups]
  workflow_dispatch:

concurrency:
  group: window-fork-build
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: select xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: write local overrides
        run: |
          cat > config/local.xcconfig <<'EOF'
          CURRENT_PROJECT_VERSION = 11.7.1
          APPCENTER_SECRET =
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          EOF

      - name: test
        run: |
          set -o pipefail
          xcodebuild test -project alt-tab-macos.xcodeproj -scheme Test -configuration Release | scripts/xcbeautify

      - name: build
        run: |
          set -o pipefail
          xcodebuild -project alt-tab-macos.xcodeproj -scheme Release -derivedDataPath DerivedData | scripts/xcbeautify

      - name: package
        run: |
          app="$(find DerivedData/Build/Products -maxdepth 2 -name AltTab.app -print -quit)"
          test -n "$app"
          ditto -c -k --keepParent "$app" AltTab.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-unsigned
          path: AltTab.zip
          retention-days: 30
